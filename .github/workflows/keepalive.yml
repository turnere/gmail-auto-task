name: Keepalive

# GitHub auto-disables scheduled workflows in a repo after 60 days with no
# pushes. This job pushes a trivial commit twice a month so the other
# scheduled workflows (daily-scan, daily-wrapup, morning-digest) never get
# silently disabled from inactivity.

on:
  schedule:
    - cron: '0 12 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update timestamp
        run: echo "Last keepalive run: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/KEEPALIVE

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/KEEPALIVE
          git commit -m "chore: keepalive $(date -u +%Y-%m-%d)"
          git push
